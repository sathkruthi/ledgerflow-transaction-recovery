name: ledgerflow
x-runtime: &runtime
  build: .
  environment: &environment
    DATABASE_URL: postgres://ledgerflow:local_demo_only@database:5432/ledgerflow?sslmode=disable
    RELAY_URL: http://relay:8091
    OTEL_EXPORTER_OTLP_ENDPOINT: http://traces:4318
  depends_on:
    init: {condition: service_completed_successfully}
  mem_limit: 128m
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"
services:
  database:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ledgerflow
      POSTGRES_USER: ledgerflow
      POSTGRES_PASSWORD: local_demo_only
    ports: ["127.0.0.1:55433:5432"]
    volumes: ["database:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ledgerflow -d ledgerflow"]
      interval: 2s
      timeout: 2s
      retries: 30
    mem_limit: 512m
  init:
    <<: *runtime
    command: ["init"]
    depends_on:
      database: {condition: service_healthy}
  api:
    <<: *runtime
    command: ["api"]
    ports: ["127.0.0.1:8090:8090"]
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://localhost:8090/health/ready"]
      interval: 2s
      timeout: 3s
      retries: 30
  relay:
    <<: *runtime
    command: ["relay"]
    ports: ["127.0.0.1:8091:8091"]
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://localhost:8091/health/ready"]
      interval: 2s
      timeout: 3s
      retries: 30
  publisher:
    <<: *runtime
    command: ["publisher"]
    depends_on:
      init: {condition: service_completed_successfully}
      relay: {condition: service_healthy}
  consumer:
    <<: *runtime
    command: ["consumer"]
  traces:
    image: jaegertracing/jaeger:2.22.0
    ports: ["127.0.0.1:16687:16686"]
    mem_limit: 256m
  prometheus:
    image: prom/prometheus:v3.15.0
    volumes: ["./deploy/prometheus.yml:/etc/prometheus/prometheus.yml:ro"]
    ports: ["127.0.0.1:9091:9090"]
    mem_limit: 256m
  grafana:
    image: grafana/grafana:13.2.4
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
    volumes: ["./deploy/grafana:/etc/grafana/provisioning:ro"]
    ports: ["127.0.0.1:3301:3000"]
    mem_limit: 256m
volumes:
  database:
